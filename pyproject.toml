[project]
name = "duant"
version = "0.1.0"
description = "个人量化交易系统 - 麻雀虽小，五脏俱全"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "tushare>=1.4",
    "akshare>=1.14",
    "loguru>=0.7",
    "click>=8.1",
    "pyyaml>=6.0",
    "requests>=2.31",
    "streamlit>=1.57.0",
    "plotly>=6.7.0",
]

[project.optional-dependencies]
crypto = ["ccxt>=4.0"]
web = ["streamlit>=1.35", "plotly>=5.20"]
qmt = ["xtquant>=1.0"]
simulate = ["easytrader>=0.21"]
all = ["duant[crypto,web]"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
duant = "duant.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]
